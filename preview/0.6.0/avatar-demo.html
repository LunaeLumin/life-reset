<!doctype html>
<html lang="ru">
<head>

 <style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f5f7;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(20px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom))}main{max-width:430px;margin:auto}a{color:#929eaf;text-decoration:none;font-size:12px}a:focus-visible{outline:2px solid #d9f36a;outline-offset:4px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}header span{font-size:10px;letter-spacing:.13em;color:#d9f36a}h1{font-size:26px;letter-spacing:-.03em;margin:0 0 7px}p{font-size:13px;line-height:1.5;color:#929eaf;margin:0 0 18px}.demo-card{padding:18px;border:1px solid #2b2f38;border-radius:25px;background:#191b20}.demo-note{margin:15px 4px 0;font-size:11px;text-align:center}

 </script>
